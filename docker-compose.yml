# Local development dependencies: Postgres + MinIO (S3-compatible stand-in for Backblaze B2).
#   docker compose up -d
#   cp .env.example .env   # use the MinIO values from the README, then: go run ./cmd/api
# The API itself runs on the host so presigned photo URLs point at an address the phone can reach.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: meowshot
      POSTGRES_PASSWORD: meowshot
      POSTGRES_DB: meowshot
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: meowshot
      MINIO_ROOT_PASSWORD: meowshot-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 meowshot meowshot-secret; do sleep 1; done;
             mc mb --ignore-existing local/meowshot-photos"

volumes:
  pgdata:
  miniodata:
